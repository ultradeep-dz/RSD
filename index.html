<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Smart Door Lock</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 360px; text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; color: #fff; }
    .lock-icon { font-size: 80px; margin: 24px 0; transition: all 0.3s; }
    .lock-icon.unlocked { color: #4caf50; }
    .lock-icon.locked { color: #e0e0e0; }
    .lock-icon.unlocking { color: #ff9800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #333; border-radius: 8px; background: #16213e; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #0f3460; }
    button { width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 8px; background: #0f3460; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1a4a7a; }
    button:disabled { background: #444; cursor: not-allowed; }
    button.primary { background: #e94560; }
    button.primary:hover { background: #ff6b6b; }
    .status { margin: 12px 0; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    .status.error { background: #531; color: #faa; }
    .status.success { background: #152; color: #afa; }
    .status.info { background: #223; color: #aaf; }
    .hidden { display: none !important; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; margin: 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" crossorigin src="/assets/index-Dt41m3W7.js"></script>
</head>
<body>
  <div class="container" id="app">
    <div id="loginScreen">
      <h1>Door Lock</h1>
      <div class="lock-icon locked">&#128274;</div>
      <input type="text" id="userName" placeholder="User Name" maxlength="32">
      <input type="password" id="passKey" placeholder="Pass Key" maxlength="32">
      <button id="connectBtn">Connect & Login</button>
      <div class="status info" id="loginStatus">Enter credentials and connect via BLE</div>
    </div>
    <div id="mainScreen" class="hidden">
      <h1>My Door</h1>
      <div class="lock-icon locked" id="lockIcon">&#128274;</div>
      <button class="primary" id="unlockBtn">UNLOCK DOOR</button>
      <div class="status info" id="mainStatus">BLE: Ready</div>
      <button id="logoutBtn" style="background:#333;margin-top:20px;">Logout</button>
    </div>
    <div id="unlockingScreen" class="hidden">
      <h1>Unlocking...</h1>
      <div class="spinner"></div>
      <p>Please wait</p>
    </div>
  </div>
</body>
</html>
